<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🌱%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet"><title>Mon compte, MicroIntern</title></head><body data-page="compte"><header id="top"></header><main><h1>👤 Mon compte</h1><p id="who"></p><h2>🧾 Mes commandes</h2><div id="list"><p>⏳ Chargement…</p></div><p class="mute">📚 Les 100 dernières commandes sont affichées.</p><div id="stu"><h2>🎓 Proposer un service</h2><form id="sf" class="box"><div class="two"><label>🏷️ Nom du service<input name="name" required maxlength="80" placeholder="Ex. Affiche pour un événement"></label><label>📂 Catégorie<select name="category"><option value="design">Design</option><option value="web">Web</option><option value="marketing">Marketing</option><option value="redaction">Rédaction</option><option value="traduction">Traduction</option></select></label></div><label>💰 Prix (DT)<input name="price" type="number" min="0" step="0.01" required></label><label>📝 Description<textarea name="description" rows="2" maxlength="300" required></textarea></label><label>🎁 Ce qui est inclus<input name="features" maxlength="150" placeholder="Ex. 2 retouches, livraison en 3 jours"></label><div><button class="btn" type="submit">✅ Publier mon service</button></div></form><h2>🎨 Mes services</h2><div id="sl"></div></div></main><div id="foot"></div><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script defer src="supabase-client.js"></script><script defer src="app.js"></script></body></html>
