<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🌱%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet"><title>Admin, MicroIntern</title></head><body data-page="admin"><header id="top"></header><main>
<div id="deny" class="err" hidden>🔒 Cette page est réservée à l’administrateur. Votre compte est un compte client.</div>
<div id="adm" hidden><h1>🛠️ Administration</h1>
<section><h2>📦 Gestion des commandes</h2><div class="row"><label>🔎 Filtre<select id="of"><option value="">Tous les statuts</option><option value="new">Nouvelle</option><option value="prep">En préparation</option><option value="done">Terminée</option><option value="cancel">Annulée</option></select></label><button class="btn sm" id="ref">🔄 Actualiser</button></div><div id="orders"></div><button class="btn sm" id="more" hidden>⬇️ Chargement de la suite</button></section>
<section><h2>🎨 Services</h2><form id="pf" class="box"><h3 id="pt">➕ Ajouter un service</h3><div class="two"><label>🔖 Identifiant (sans espace)<input name="id" required pattern="[a-z0-9-]+" maxlength="40"></label><label>🏷️ Nom<input name="name" required maxlength="80"></label><label>📂 Catégorie<select name="category"><option value="design">Design</option><option value="web">Web</option><option value="marketing">Marketing</option><option value="redaction">Rédaction</option><option value="traduction">Traduction</option></select></label><label>💰 Prix (DT)<input name="price" type="number" min="0" step="0.01" required></label></div><label>🖼️ Image (URL HTTPS, facultatif)<input name="image" type="url" pattern="https://.*"></label><label>📝 Description<textarea name="description" rows="2" maxlength="300"></textarea></label><label>🎁 Caractéristiques<input name="features" maxlength="150"></label><label><span><input type="checkbox" name="available" checked> 👀 Visible dans la boutique</span></label><div><button class="btn" type="submit">💾 Enregistrer</button><button class="btn alt" type="button" id="pn">✨ Nouveau produit</button></div></form><div id="plist"></div></section><section><h2>💌 Messages reçus</h2><div id="msgs"></div></section></div>
</main><div id="foot"></div><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script defer src="supabase-client.js"></script><script defer src="app.js"></script></body></html>
