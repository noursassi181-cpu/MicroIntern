<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🌱%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet"><title>Connexion, MicroIntern</title></head><body data-page="login"><header id="top"></header><main><h1>🔑 Mon compte</h1><div id="cfg" class="err" hidden>⚠️ Supabase n’est pas encore configuré. Suivez SUPABASE.md.</div>
<div class="tabs"><button class="btn" id="t1">🔑 Se connecter</button><button class="btn alt" id="t2">🌸 Créer un compte</button></div>
<form id="fin" class="box"><label>📧 E-mail<input name="email" type="email" required autocomplete="email"></label><label>🔒 Mot de passe<input name="pw" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">🚪 Entrer</button><button type="button" class="link" id="fgl">Mot de passe oublié ?</button></form><form id="ffg" class="box" hidden><label>📧 E-mail du compte<input name="email" type="email" required autocomplete="email"></label><button class="btn" type="submit">📬 Recevoir un lien</button></form>
<form id="fup" class="box" hidden><fieldset class="box"><legend>Je suis…</legend><label class="pick"><input type="radio" name="type" value="student" required> 🎓 Étudiant : je propose mes services</label><label class="pick"><input type="radio" name="type" value="company"> 🏢 Entreprise : je cherche des services</label></fieldset><div class="two"><label>🙂 Prénom<input name="fn" required maxlength="40"></label><label>🙂 Nom<input name="ln" required maxlength="40"></label></div><label>📧 E-mail<input name="email" type="email" required autocomplete="email"></label><div class="two"><label>🔒 Mot de passe (8 caractères min.)<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label><label>🔒 Confirmer<input name="pw2" type="password" minlength="8" required autocomplete="new-password"></label></div><button class="btn" type="submit">🌸 Créer mon compte</button></form>
<p id="msg" role="status"></p></main><div id="foot"></div><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script defer src="supabase-client.js"></script><script defer src="app.js"></script></body></html>
